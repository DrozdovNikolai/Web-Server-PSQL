name: postgres-control-plane

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: postgres_control
      POSTGRES_USER: postgres_control
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_control -d postgres_control"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MainDatabase: Host=postgres;Port=5432;Database=postgres_control;Username=postgres_control;Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__Issuer: PostgresControlPlane
      Jwt__Audience: PostgresControlPlane.Client
      Jwt__AccessTokenLifetimeMinutes: "15"
      Hosting__PathBase: /server
      Cors__AllowedOrigins__0: http://localhost:5173
      Storage__RootPath: data/uploads
      Storage__MaxFileSizeBytes: "10485760"
      DatabaseInitialization__ApplyMigrations: "true"
      DatabaseBrowser__RoutineExecutionEnabled: "true"
      DatabaseBrowser__AllowedRoutineSchemas__0: public
      DatabaseBrowser__AllowProcedures: "true"
      DatabaseBrowser__AllowSecurityDefiner: "false"
      DatabaseBrowser__RoutineCommandTimeoutSeconds: "10"
      DatabaseBrowser__MaxRoutineArguments: "32"
      DatabaseBrowser__MaxRoutineArgumentLength: "16384"
      DatabaseBrowser__MaxRoutineRows: "200"
      DatabaseBrowser__RoutineExcelExportEnabled: "true"
      DatabaseBrowser__MaxExcelRows: "10000"
      DatabaseBrowser__MaxExcelColumns: "256"
      DatabaseBrowser__MaxExcelCells: "200000"
      DatabaseBrowser__MaxExcelFileSizeBytes: "10485760"
      BootstrapAdmin__Enabled: "true"
      BootstrapAdmin__Username: ${BOOTSTRAP_ADMIN_USERNAME:?Set BOOTSTRAP_ADMIN_USERNAME in .env}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      Kubernetes__Enabled: "false"
      Kubernetes__Namespace: postgres-control
      Kubernetes__WorkloadImage: postgres-control-plane:1.0.0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/server/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "5050:8080"
    volumes:
      - api_data:/app/data
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [backend]
    restart: unless-stopped

  web:
    build:
      context: admin-panel
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [backend]
    restart: unless-stopped

networks:
  backend:

volumes:
  postgres_data:
  api_data:
