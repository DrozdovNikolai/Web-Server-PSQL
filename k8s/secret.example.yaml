apiVersion: v1
kind: Secret
metadata:
  name: postgres-control-secrets
  namespace: postgres-control
type: Opaque
stringData:
  ConnectionStrings__MainDatabase: "replace-me"
  Jwt__SigningKey: "replace-with-a-random-secret-of-at-least-32-characters"
  BootstrapAdmin__Username: "admin"
  BootstrapAdmin__Password: "replace-with-a-strong-random-password"
