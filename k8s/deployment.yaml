apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-control
  namespace: postgres-control
  labels:
    app.kubernetes.io/name: postgres-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-control-plane
    spec:
      serviceAccountName: postgres-control
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace this example reference with an immutable release tag or digest.
          image: ghcr.io/example/postgres-control-plane:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: postgres-control-config
            - secretRef:
                name: postgres-control-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /server/health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /server/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /server/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-control-data
        - name: tmp
          emptyDir: {}
