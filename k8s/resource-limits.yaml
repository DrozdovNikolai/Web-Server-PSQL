apiVersion: v1
kind: ResourceQuota
metadata:
  name: postgres-control-quota
  namespace: postgres-control
spec:
  hard:
    pods: "20"
    services: "20"
    secrets: "50"
    configmaps: "50"
    persistentvolumeclaims: "20"
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "10"
    limits.memory: 10Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: postgres-control-defaults
  namespace: postgres-control
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 96Mi
      default:
        cpu: 500m
        memory: 512Mi
